services:
  # FastAPI Backend
  - type: web
    name: da-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: da-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: da-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "*" # Can be restricted to Vercel URL later
      - key: PYTHON_VERSION
        value: 3.11.0

  # Redis Cache
  - type: redis
    name: da-redis
    plan: free
    ipAllowList: []

databases:
  # PostgreSQL Database
  - name: da-postgres
    databaseName: digital_alpha
    user: da_user
    plan: free

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: da-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_alpha
      POSTGRES_USER: da_user
      POSTGRES_PASSWORD: da_pass_local
    ports:
      - "5555:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da_user -d digital_alpha"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: da-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
